<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal - EMRS MD-Connect</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; background-color: #f4f7f6; }
        .sidebar { width: 250px; background: #2E7D32; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { margin-bottom: 30px; font-size: 20px; text-align: center; border-bottom: 1px solid #4CAF50; padding-bottom: 10px; }
        .menu-item { padding: 15px; background: #4CAF50; margin-bottom: 10px; border-radius: 5px; text-align: center; font-weight: bold; cursor: pointer;}
        .logout-btn { margin-top: auto; background: #c62828; padding: 15px; text-align: center; border-radius: 5px; cursor: pointer; color: white; text-decoration: none; font-weight: bold;}
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>EMRS MD-Connect<br><span style="font-size: 14px; font-weight: normal;">Student Portal</span></h2>
        <div class="menu-item">My Result</div>
        <div class="menu-item">Teachers Profile</div>
        <a href="#" class="logout-btn" onclick="handleLogout()">🚪 Logout</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h2 id="welcome-text">Welcome, Student</h2>
            <p style="color: #666; margin-top: 5px;">View your academic records and school information.</p>
        </div>

        <div class="card">
            <h3>Your Academic Result</h3>
            <p style="margin-top: 10px; color: #555;">Results will appear here once published by teachers.</p>
        </div>
    </div>

    <script>
        if(!localStorage.getItem('student_auth')) { window.location.href = 'login.html'; }
        document.getElementById('welcome-text').innerText = "Welcome, " + localStorage.getItem('student_name');

        function handleLogout() {
            localStorage.removeItem('student_auth');
            localStorage.removeItem('student_name');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
