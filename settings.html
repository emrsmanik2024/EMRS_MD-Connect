<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Settings</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>StudentHub</h2></div>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="students.html">Students</a></li>
                <li><a href="attendance.html">Attendance</a></li>
                <li><a href="marks.html">Marks Entry</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="settings.html" class="active">Settings</a></li>
                <li><a href="login.html" style="margin-top: 20px; color: #DC2626;">Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>School Settings</h2>
            </header>

            <div class="form-container" style="display: block; max-width: 600px;">
                <h3 style="margin-bottom: 20px; color: var(--primary-color);">Update School Information</h3>
                
                <div class="form-group">
                    <label>School Name</label>
                    <input type="text" id="schoolName" placeholder="e.g. StudentHub Public School">
                </div>
                
                <div class="form-group">
                    <label>School Address</label>
                    <input type="text" id="schoolAddress" placeholder="e.g. Alipurduar, West Bengal">
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="text" id="schoolContact" placeholder="e.g. +91 9876543210">
                    </div>
                    <div class="form-group">
                        <label>Academic Year</label>
                        <!-- অপশনগুলো JS থেকে অটোমেটিক আসবে -->
                        <select id="academicYear"></select>
                    </div>
                </div>

                <button class="btn btn-success" style="width: 100%; margin-top: 10px; padding: 12px;" onclick="saveSchoolInfo()">Save Settings</button>
            </div>
        </main>
    </div>

    <script src="js/settings.js"></script>
</body>
</html>
