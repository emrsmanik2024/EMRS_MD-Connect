<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMRS MD-Connect - Portal</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 420px; }
        .login-card h2 { text-align: center; color: #111827; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #374151; font-size: 14px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 15px; }
        button { width: 100%; padding: 14px; background: #2563EB; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #1D4ED8; }
        
        .message { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; }
        .link-btn { display: block; text-align: center; margin-top: 15px; color: #2563EB; cursor: pointer; font-size: 14px; text-decoration: none; font-weight: bold; }
        .link-btn:hover { text-decoration: underline; }

        #forgot-section { display: none; }
        #reset-fields { display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="login-card">
    <div id="login-section">
        <h2>EMRS MD-Connect Login</h2>
        
        <div class="form-group">
            <label>Select Role</label>
            <select id="user-role">
                <option value="admin">Admin</option>
                <option value="teacher">Teacher</option>
                <option value="student">Student</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        
        <button onclick="handleLogin()">Login</button>
        <div id="login-message" class="message"></div>
        <a class="link-btn" onclick="toggleView('forgot')">Forgot Password?</a>
    </div>

    <div id="forgot-section">
        <h2>Reset Password</h2>
        <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 20px;">Enter your registered email to receive an OTP.</p>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="f-email" placeholder="Enter your email" required>
        </div>
        
        <button id="send-otp-btn" onclick="sendOTP()">Send OTP</button>

        <div id="reset-fields">
            <div class="form-group">
                <label>Enter 6-Digit OTP</label>
                <input type="text" id="f-otp" placeholder="e.g. 123456" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="f-new-password" placeholder="Create new password" required>
            </div>
            <button onclick="resetPassword()" style="background: #059669;">Confirm Reset</button>
        </div>

        <div id="forgot-message" class="message"></div>
        <a class="link-btn" onclick="toggleView('login')" style="color: #6B7280;">⬅ Back to Login</a>
    </div>
</div>

<script>
    function toggleView(view) {
        document.getElementById('login-section').style.display = view === 'login' ? 'block' : 'none';
        document.getElementById('forgot-section').style.display = view === 'forgot' ? 'block' : 'none';
        document.getElementById('login-message').innerText = '';
        document.getElementById('forgot-message').innerText = '';
    }

    async function handleLogin() {
        const role = document.getElementById('user-role').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msgEl = document.getElementById('login-message');

        if(!email || !password) {
            msgEl.style.color = 'red';
            msgEl.innerText = 'Please enter both email and password.';
            return;
        }

        msgEl.style.color = 'blue';
        msgEl.innerText = 'Verifying credentials...';

        let apiUrl = '';
        if (role === 'admin') apiUrl = 'http://localhost:4000/api/login';
        else if (role === 'teacher') apiUrl = 'http://localhost:4000/api/teacher-login';
        else apiUrl = 'http://localhost:4000/api/student-login';

        try {
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (data.success) {
                msgEl.style.color = 'green';
                msgEl.innerText = "✅ Login Successful! Redirecting...";
                
                if (role === 'admin') {
                    localStorage.setItem('studenthub_auth', data.token);
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                } else if (role === 'teacher') {
                    localStorage.setItem('teacher_auth', data.token);
                    localStorage.setItem('teacher_name', data.name);
                    localStorage.setItem('teacher_subject', data.subject);
                    setTimeout(() => { window.location.href = 'teacher-dashboard.html'; }, 1000);
                } else {
                    localStorage.setItem('student_auth', data.token);
                    localStorage.setItem('student_name', data.name);
                    setTimeout(() => { window.location.href = 'student-dashboard.html'; }, 1000);
                }
            } else {
                msgEl.style.color = 'red';
                msgEl.innerText = '❌ ' + data.message;
            }
        } catch (error) {
            msgEl.style.color = 'red';
            msgEl.innerText = "❌ Server error. Ensure backend is running.";
        }
    }

    async function sendOTP() {
        const email = document.getElementById('f-email').value;
        const msgEl = document.getElementById('forgot-message');

        if(!email) {
            msgEl.style.color = 'red';
            msgEl.innerText = 'Please enter your email first.';
            return;
        }

        msgEl.style.color = 'blue';
        msgEl.innerText = 'Sending OTP to your email...';

        try {
            const res = await fetch('http://localhost:4000/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (data.success) {
                msgEl.style.color = 'green';
                msgEl.innerText = '✅ ' + data.message;
                document.getElementById('reset-fields').style.display = 'block';
                document.getElementById('send-otp-btn').style.display = 'none';
            } else {
                msgEl.style.color = 'red';
                msgEl.innerText = '❌ ' + data.message;
            }
        } catch (error) {
            msgEl.style.color = 'red';
            msgEl.innerText = "❌ Server error. Ensure backend is running.";
        }
    }

    async function resetPassword() {
        const email = document.getElementById('f-email').value;
        const otp = document.getElementById('f-otp').value;
        const newPassword = document.getElementById('f-new-password').value;
        const msgEl = document.getElementById('forgot-message');

        if(!otp || !newPassword) {
            msgEl.style.color = 'red';
            msgEl.innerText = 'Please enter OTP and New Password.';
            return;
        }

        msgEl.style.color = 'blue';
        msgEl.innerText = 'Resetting password...';

        try {
            const res = await fetch('http://localhost:4000/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, otp, newPassword })
            });
            const data = await res.json();

            if (data.success) {
                msgEl.style.color = 'green';
                msgEl.innerText = '✅ Password Reset Successfully! Redirecting to login...';
                
                setTimeout(() => {
                    toggleView('login');
                    document.getElementById('reset-fields').style.display = 'none';
                    document.getElementById('send-otp-btn').style.display = 'block';
                    document.getElementById('f-email').value = '';
                    document.getElementById('f-otp').value = '';
                    document.getElementById('f-new-password').value = '';
                }, 3000);
            } else {
                msgEl.style.color = 'red';
                msgEl.innerText = '❌ ' + data.message;
            }
        } catch (error) {
            msgEl.style.color = 'red';
            msgEl.innerText = "❌ Server error. Ensure backend is running.";
        }
    }
</script>
</body>
</html>
