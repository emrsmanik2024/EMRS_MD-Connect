<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Reports</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        @media print {
            .sidebar, .top-header, .no-print { display: none !important; }
            .dashboard-wrapper { display: block; }
            .main-content { padding: 0; overflow: visible; }
            .data-container { box-shadow: none; padding: 0; }
            body { background: white; }
            table { width: 100%; border: 1px solid #000; }
            th, td { border: 1px solid #000; padding: 10px; }
        }
        
        .report-header { text-align: center; margin-bottom: 20px; display: none; }
        @media print { .report-header { display: block; } }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>StudentHub</h2></div>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="students.html">Students</a></li>
                <li><a href="attendance.html">Attendance</a></li>
                <li><a href="marks.html">Marks Entry</a></li>
                <li><a href="reports.html" class="active">Reports</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="login.html" style="margin-top: 20px; color: #DC2626;">Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>Generate Reports</h2>
            </header>

            <div class="data-container no-print" style="margin-bottom: 20px;">
                <div class="form-grid" style="align-items: end;">
                    <div class="form-group">
                        <label>Exam Type</label>
                        <select id="repExamType">
                            <option value="PT_I">PT I</option>
                            <option value="PT_II">PT II</option>
                            <option value="Term_I">Term I</option>
                            <option value="PT_III">PT III</option>
                            <option value="PT_IV">PT IV</option>
                            <option value="Term_II">Term II</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Select Class</label>
                        <select id="repClass">
                            <option value="">Choose Class...</option>
                            <option>Class VI</option>
                            <option>Class VII</option>
                            <option>Class VIII</option>
                            <option>Class IX</option>
                            <option>Class X</option>
                            <option>Class XI</option>
                            <option>Class XII</option>
                        </select>
                    </div>
                    <div class="form-group" style="display: flex; gap: 10px;">
                        <button class="btn btn-primary" style="flex: 1; margin-bottom: 2px;" onclick="generateReport()">Generate</button>
                        <button class="btn btn-success" style="flex: 1; margin-bottom: 2px; background: #10B981;" onclick="window.print()">🖨️ Print</button>
                    </div>
                </div>
            </div>

            <div id="reportArea" class="data-container" style="display: none; overflow-x: auto;">
                
                <div class="report-header">
                    <h2 id="printSchoolName">StudentHub Public School</h2>
                    <p id="printSchoolAddress" style="font-size: 14px; color: #6B7280; margin-bottom: 5px;"></p>
                    <p style="font-weight: 600;">Performance & Attendance Report <span id="printAcademicYear"></span></p>
                    <h3 id="printExamClass" style="margin-top: 10px; color: #4F46E5;"></h3>
                </div>

                <table style="min-width: 800px; margin-top: 10px;">
                    <thead>
                        <tr>
                            <th>Roll</th>
                            <th style="text-align: left;">Name</th>
                            <th>Section</th>
                            <th>Total Marks (700)</th>
                            <th>Percentage</th>
                            <th>Grade</th>
                            <th>Attendance</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <!-- Data will load here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/reports.js"></script>
</body>
</html>
